server:
  address: ${SERVER_HOST:127.0.0.1}
  # Render injects PORT. SERVER_PORT remains available for local development.
  port: ${PORT:${SERVER_PORT:4173}}
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 7d
      cookie:
        name: ZIPAI_SESSION
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}

spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  application:
    name: zipai
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/zipai?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:zipai}
    password: ${DB_PASSWORD:change-me}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul
  flyway:
    enabled: true
    locations: classpath:db/migration
  thymeleaf:
    cache: false
  cache:
    type: simple
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties.mail.smtp.auth: ${MAIL_AUTH:false}
    properties.mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}

zipai:
  verification:
    pepper: ${VERIFICATION_PEPPER:change-this-in-production}
    mail-from: ${MAIL_FROM:no-reply@zipai.local}
    require-signup: ${REQUIRE_SIGNUP_VERIFICATION:true}
    expose-code: false
  sms:
    provider: ${SMS_PROVIDER:disabled}
    naver:
      access-key: ${NCP_ACCESS_KEY:}
      secret-key: ${NCP_SECRET_KEY:}
      service-id: ${NCP_SENS_SERVICE_ID:}
      from: ${NCP_SMS_FROM:}
  admin:
    statistics-refresh-ms: ${ADMIN_STATISTICS_REFRESH_MS:60000}
  ocr:
    clova:
      invoke-url: ${CLOVA_OCR_INVOKE_URL:}
      secret: ${CLOVA_OCR_SECRET:}
  report:
    file-key: ${REPORT_FILE_KEY:change-this-report-file-key-in-production}
  oauth:
    public-base-url: ${PUBLIC_BASE_URL:http://127.0.0.1:4173}
    kakao:
      client-id: ${KAKAO_CLIENT_ID:}
      client-secret: ${KAKAO_CLIENT_SECRET:}
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}

server.error.include-message: never
