spring:
  datasource:
    url: jdbc:h2:file:./data/zipai-local;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;AUTO_SERVER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
  flyway:
    enabled: false
  sql:
    init:
      mode: always
      schema-locations: classpath:db/local-demo-schema.sql
  mail:
    host: localhost
    port: 1025

zipai:
  sms:
    provider: console
  verification:
    pepper: local-demo-only-pepper-not-for-production
    require-signup: true
    expose-code: true
  report:
    file-key: local-demo-report-file-key

logging:
  level:
    org.springframework: INFO
    com.zipai: INFO
